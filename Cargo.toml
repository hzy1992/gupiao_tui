[package]
name = "gupiao"
version = "0.1.0"
edition = "2021"
authors = ["hzy"]
description = "A Stock Real-time Quote CLI"
license = "MIT"

[lib]
name = "gupiao"
path = "src/lib.rs"

[[bin]]
name = "gupiao"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["clock", "serde"] }
encoding_rs = "0.8"
# 存储：嵌入式 SQLite
rusqlite = { version = "0.32", features = ["bundled"] }
# 跨平台获取配置目录（Windows: %APPDATA%, Linux: ~/.config, macOS: ~/Library/Application Support）
dirs = "5.0"
# `join_all` 等并发工具
crossterm = "0.28"
futures = "0.3"
smartcore = "0.6"
ndarray = "0.17"
rand = "0.10"


[profile.release]
opt-level = 3
lto = "thin"
strip = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_Foundation"] }
