name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
    contents: write
jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: gupiao-x86_64-pc-windows-msvc.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: gupiao-x86_64-unknown-linux-gnu.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: gupiao-x86_64-apple-darwin.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: gupiao-aarch64-apple-darwin.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build release
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.os }}" == windows-latest ]]; then
            powershell -Command "Compress-Archive -Path 'target/${{ matrix.target }}/release/gupiao.exe' -DestinationPath 'dist/${{ matrix.artifact }}' -Force"
          else
            tar -czvf "dist/${{ matrix.artifact }}" -C "target/${{ matrix.target }}/release" gupiao
          fi

      - name: Upload asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}